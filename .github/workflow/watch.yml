name: Watch booking page

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay runs by a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to save booking_state.json back to the repo

concurrency:
  group: booking-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Check booking page
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch_booking.py

      - name: Save state
        run: |
          git config user.name "booking-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add booking_state.json
          git diff --cached --quiet || (git commit -m "Update booking state" && git push)
